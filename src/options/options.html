<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube Intent Filter</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <div class="header-row">
        <div>
          <h1>YouTube Intent Filter</h1>
          <p class="subtitle">Describe what you want to see. Everything runs on-device.</p>
          <button type="button" id="tour-link" class="tour-link">Take the tour</button>
        </div>
        <label class="switch" title="Enable/disable the extension">
          <input type="checkbox" id="extension-enabled" checked />
          <span class="switch-track"></span>
        </label>
      </div>

      <label for="intent">Show me</label>
      <textarea
        id="intent"
        rows="4"
        placeholder="AI research, systems, distributed training"
      ></textarea>

      <label for="avoid">Avoid (optional, described in words)</label>
      <textarea
        id="avoid"
        rows="2"
        placeholder="football, celebrity drama"
      ></textarea>
      <p class="hint">
        Put things to avoid here, not in the "Show me" box — embedding models don't understand
        "no X", so writing it into the intent tends to surface more of X, not less.
      </p>

      <!-- Multilingual model tier disabled for now — sticking to the small
           bundled model only. Re-enable by uncommenting this block and the
           matching code in options.js.
      <label class="toggle-label">
        <input type="checkbox" id="model-tier" />
        Use the larger multilingual model (accuracy over speed)
      </label>
      <p class="hint">
        Results feel off? The larger model understands more languages and subtler phrasing.
        It's slower and downloads ~570 MB the first time you switch to it.
      </p>
      <p id="model-tier-status" class="hint"></p>
      -->


      <label>Always show (keywords)</label>
      <div id="include-chips" class="chip-container"></div>

      <label>Always hide (keywords)</label>
      <div id="exclude-chips" class="chip-container"></div>

      <label class="toggle-label">
        <input type="checkbox" id="schedule-enabled" />
        Only filter during set hours
      </label>
      <div id="schedule-rows" hidden>
        <div class="schedule-row">
          <span class="schedule-label">Weekdays</span>
          <input type="time" id="weekday-start" />
          <span>to</span>
          <input type="time" id="weekday-end" />
        </div>
        <div class="schedule-row">
          <span class="schedule-label">Weekends</span>
          <input type="time" id="weekend-start" />
          <span>to</span>
          <input type="time" id="weekend-end" />
        </div>
      </div>

      <button id="save">Save</button>
      <span id="status" role="status"></span>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
