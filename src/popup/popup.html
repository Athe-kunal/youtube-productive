<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube Intent Filter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="title">YouTube Intent Filter</span>
      <div class="header-actions">
        <label class="switch" title="Enable/disable the extension">
          <input type="checkbox" id="extension-enabled" checked />
          <span class="switch-track"></span>
        </label>
        <button id="full-settings-btn" title="Open full settings page">⤢</button>
      </div>
    </header>

    <div id="body">
      <section id="settings-section">
        <label for="intent">Show me</label>
        <textarea
          id="intent"
          rows="3"
          placeholder="AI research, systems, distributed training"
        ></textarea>

        <label for="avoid">Avoid</label>
        <textarea id="avoid" rows="2" placeholder="football, celebrity drama"></textarea>

        <label>Always show (keywords)</label>
        <div id="include-chips" class="chip-container"></div>

        <label>Always hide (keywords)</label>
        <div id="exclude-chips" class="chip-container"></div>

        <label>Sensitivity</label>
        <div id="sensitivity" class="segmented"></div>

        <label class="toggle-label">
          <input type="checkbox" id="schedule-enabled" />
          Only filter during set hours
        </label>
        <div id="schedule-rows" hidden>
          <div class="schedule-row">
            <span class="schedule-label">Weekdays</span>
            <input type="time" id="weekday-start" />
            <span>–</span>
            <input type="time" id="weekday-end" />
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Weekends</span>
            <input type="time" id="weekend-start" />
            <span>–</span>
            <input type="time" id="weekend-end" />
          </div>
        </div>

        <button id="save">Save</button>
        <span id="status" role="status"></span>
      </section>

      <hr />

      <section id="filtered-section">
        <p class="section-heading">Filtered on this page</p>
        <p id="empty-state" class="muted">Loading…</p>
        <ul id="list"></ul>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
